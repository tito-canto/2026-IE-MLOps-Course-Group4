# config.yaml  [Settings: single source of truth]
# -------------------------------------------------------------------
# Purpose   Every NON-SECRET setting the pipeline needs, in one place
# Read by   main.py (stage 3: through src/config.py), later also api.py
# Why       Change the target, features or split sizes without touching code
# Never     Secrets (API keys, passwords). Those go in .env
#
# Typical sections
#   paths     where raw data, model, inference data and predictions live
#   problem   target column, problem type (classification or regression), ID column
#   split     test size, validation size, random seed
#
# Stage 2: the same values live in a SETTINGS dictionary at the top of src/main.py
# Stage 3: main.py reads this file instead, with the same key names


paths:
  raw_data: "data/raw/insurance.csv"
  processed_data: "data/processed/processed.csv"
  predictions: "data/inference"
  model: "models/model.joblib"
data:
  required_columns: ["age", "sex", "bmi", "children", "smoker", "region", "charges"]
  feature: ["age", "sex", "bmi", "children", "smoker", "region"]
  target: "charges"
  numeric: ["age", "bmi", "children"]
  categorical: ["sex", "smoker", "region"]
validation:
  expected_rows: 1338
variables:
  seed: 47
evaluation:
  metrics: ["r2", "mae", "rmse"]
# Go/no-go decision on the reserved sample. mae/rmse pass when value <= threshold,
# r2 passes when value >= threshold.
# The model is trained with squared error (OLS) but the business case promises an MAE
# target, so the gate checks MAE. Threshold = 0.90 * baseline_mae, where baseline_mae
# = 2423.5 is the similar-customers method on the same reserved sample (see README,
# "Problem and baseline"). The current OLS model scores ~4035 and fails this gate.
quality_gate:
  metric: "mae"
  threshold: 2181.2
