# environment.yml  [Dependencies]
# -------------------------------------------------------------------
# Purpose   List the packages (and Python version) the project needs
# Used by   You and your teammates: conda env create -f environment.yml
# Why       Everyone runs the same code on the same versions ("works on my machine" ends here)
#
# Typical groups
#   data and modelling    e.g. pandas, scikit-learn, joblib
#   notebooks and plots   exploration only
#   quality (stage 2)     test runner, coverage, style checker
#   stage 3               config, tracking, serving and locking tools
#
# Stage 3: conda-lock.yml freezes these into exact versions for CI and Docker

name: insurance-mlops
channels:
  - conda-forge
dependencies:
  - python=3.10.6
  - pip=22.2.1
  - setuptools=63.2.0

  # Data and modelling
  - joblib=1.6.0
  - numpy=2.2.6
  - pandas=2.3.3
  - python-dateutil=2.9.0.post0  # requirements.txt: 3.0.0, conda-forge build needs Python >=3.11
  - python-tzdata=2026.3  # "tzdata" on PyPI; requirements.txt: 2026.6, needs Python >=3.11
  - pytz=2026.3.post1  # requirements.txt: 2026.6, needs Python >=3.11
  - scikit-learn=1.7.2
  - six=1.17.0
  - statsmodels=0.15.0

  # Notebooks and plots
  - contourpy=1.3.2
  - cycler=0.12.1
  - fonttools=4.63.0  # requirements.txt: 4.65.0, no conda-forge build for Python 3.10
  - ipykernel=7.3.0
  - ipython=8.37.0  # requirements.txt: 8.39.0, not on conda-forge
  - kiwisolver=1.5.1
  - matplotlib=3.10.9
  - packaging=26.3
  - pillow=12.3.0
  - pyparsing=3.3.2  # requirements.txt: 3.3.3, conda-forge build needs Python >=3.11
  - seaborn=0.13.2

  # Configuration
  - pyyaml=6.0.3

  # Quality
  - pytest=9.2.0
  - pytest-cov
  - flake8
